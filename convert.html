<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片格式转换 — PNG/JPG/WebP 在线互转 | PixTools</title>
<meta name="description" content="免费在线图片格式转换:PNG、JPG、WebP 一键互转。WebP 转 JPG、JPG 转 PNG、图片转 WebP 缩小体积。浏览器本地转换,图片不上传服务器。">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://pixtools.morio.cc/convert.html">
<link rel="stylesheet" href="/css/style.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "图片格式转换",
  "url": "https://pixtools.morio.cc/convert.html",
  "applicationCategory": "MultimediaApplication",
  "operatingSystem": "Any",
  "offers": {"@type": "Offer", "price": "0", "priceCurrency": "CNY"},
  "description": "PNG/JPG/WebP 图片格式在线互转,本地转换不上传服务器。"
}
</script>
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a href="/" class="logo"><span class="logo-mark">▦</span> PixTools<span class="logo-sub">图片工具箱</span></a>
    <nav class="nav">
      <a href="/removebg.html">抠图</a>
      <a href="/compress.html">压缩</a>
      <a href="/convert.html">转换</a>
      <a href="/resize.html">缩放</a>
      <a href="/filters.html">滤镜</a>
    </nav>
  </div>
</header>

<main class="container tool-page">
  <h1>⇄ 图片格式转换</h1>
  <p class="tool-blurb">PNG、JPG、WebP 三种格式一键互转:WebP 转 JPG(兼容老软件)、JPG 转 PNG(透明底需求)、任意转 WebP(体积最小)。本地转换,图片不上传服务器。</p>

  <div class="msg-error"></div>
  <div class="status" id="status">
    <div class="spinner"></div>
    <div class="progress-track"><div class="progress-bar" id="statusBar"></div></div>
    <div class="status-text" id="statusText">转换中…</div>
  </div>

  <div class="dropzone hidden-after-upload" id="dropzone">
    <div class="dropzone-icon">🖼</div>
    <div class="dropzone-text">点击选择图片或拖拽图片到此处</div>
    <div class="dropzone-sub">PNG / JPG / WebP</div>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <div class="work-area hidden" id="workArea">
    <div class="controls">
      <div class="control">
        <label for="target">转换目标格式</label>
        <select id="target">
          <option value="image/webp">WebP</option>
          <option value="image/jpeg">JPG</option>
          <option value="image/png">PNG</option>
        </select>
      </div>
      <div class="control">
        <label for="quality">JPG/WebP 质量 <span id="qualityVal">90</span>%</label>
        <input type="range" id="quality" min="30" max="100" value="90">
      </div>
      <button class="btn btn-primary" id="btnExport">⬇ 导出转换图</button>
    </div>
    <div class="compare">
      <div class="compare-box">
        <h3>原图</h3>
        <img id="previewOrig" alt="原图">
        <div class="compare-meta" id="metaOrig"></div>
      </div>
      <div class="compare-box">
        <h3>转换后</h3>
        <img id="previewResult" alt="转换后">
        <div class="compare-meta" id="metaResult"></div>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <p>© 2026 PixTools 图片工具箱 · 所有处理均在浏览器本地完成</p>
  </div>
</footer>

<script src="/js/common.js"></script>
<script>
let currentBlob = null;
let currentExt = 'webp';
let cachedImg = null;
let origSize = 0;

async function handleFile(file) {
  clearError();
  origSize = file.size;
  document.getElementById('dropzone').classList.add('hidden');
  document.getElementById('workArea').classList.remove('hidden');
  const img = await loadImage(file);
  cachedImg = img;
  document.getElementById('previewOrig').src = img.src;
  document.getElementById('metaOrig').textContent = `${file.name} · ${fmtBytes(file.size)} · ${img.naturalWidth}×${img.naturalHeight}`;
  convert();
}

async function convert() {
  if (!cachedImg) return;
  const target = document.getElementById('target').value;
  const q = parseInt(document.getElementById('quality').value);
  currentExt = target === 'image/jpeg' ? 'jpg' : target === 'image/png' ? 'png' : 'webp';

  const status = document.getElementById('status');
  status.classList.add('show');
  document.getElementById('statusText').textContent = `转换为 ${currentExt.toUpperCase()}…`;
  document.getElementById('statusBar').style.width = '50%';

  const canvas = document.createElement('canvas');
  canvas.width = cachedImg.naturalWidth;
  canvas.height = cachedImg.naturalHeight;
  const ctx = canvas.getContext('2d');

  if (target === 'image/jpeg') {
    // JPG 不支持透明,白底填充
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  ctx.drawImage(cachedImg, 0, 0);

  currentBlob = await new Promise((res) => canvas.toBlob(res, target, q / 100));
  document.getElementById('statusBar').style.width = '100%';
  setTimeout(() => status.classList.remove('show'), 400);

  const url = URL.createObjectURL(currentBlob);
  document.getElementById('previewResult').src = url;
  const diff = origSize > 0 ? ((currentBlob.size - origSize) / origSize * 100).toFixed(0) : 0;
  document.getElementById('metaResult').textContent =
    `${fmtBytes(currentBlob.size)} · ${diff >= 0 ? '+' : ''}${diff}% vs 原图`;
}

document.getElementById('target').addEventListener('change', () => { clearError(); convert(); });
document.getElementById('quality').addEventListener('input', () => {
  document.getElementById('qualityVal').textContent = document.getElementById('quality').value;
  clearError(); convert();
});
document.getElementById('btnExport').addEventListener('click', () => {
  if (currentBlob) download(currentBlob, swapExt('converted', currentExt));
});

setupDropzone('dropzone', 'fileInput', handleFile);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线图片滤镜 — 亮度对比度饱和度调节、黑白、复古 | PixTools</title>
<meta name="description" content="免费在线图片滤镜工具:调节亮度、对比度、饱和度、色温,一键黑白、复古、模糊效果,实时预览。浏览器本地处理,图片不上传服务器。">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://pixtools.morio.cc/filters.html">
<link rel="stylesheet" href="/css/style.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "在线图片滤镜",
  "url": "https://pixtools.morio.cc/filters.html",
  "applicationCategory": "MultimediaApplication",
  "operatingSystem": "Any",
  "offers": {"@type": "Offer", "price": "0", "priceCurrency": "CNY"},
  "description": "在线图片滤镜与调色工具,本地处理不上传服务器。"
}
</script>
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a href="/" class="logo"><span class="logo-mark">▦</span> PixTools<span class="logo-sub">图片工具箱</span></a>
    <nav class="nav">
      <a href="/removebg.html">抠图</a>
      <a href="/compress.html">压缩</a>
      <a href="/convert.html">转换</a>
      <a href="/resize.html">缩放</a>
      <a href="/filters.html">滤镜</a>
    </nav>
  </div>
</header>

<main class="container tool-page">
  <h1>◐ 在线图片滤镜</h1>
  <p class="tool-blurb">调节亮度、对比度、饱和度,一键黑白、复古、模糊、反色效果。实时预览,本地处理不上传服务器。</p>

  <div class="msg-error"></div>
  <div class="status" id="status">
    <div class="spinner"></div>
    <div class="progress-track"><div class="progress-bar" id="statusBar"></div></div>
    <div class="status-text" id="statusText">处理中…</div>
  </div>

  <div class="dropzone hidden-after-upload" id="dropzone">
    <div class="dropzone-icon">🖼</div>
    <div class="dropzone-text">点击选择图片或拖拽图片到此处</div>
    <div class="dropzone-sub">JPG / PNG / WebP</div>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <div class="work-area hidden" id="workArea">
    <div class="controls">
      <div class="control">
        <label for="brightness">亮度 <span id="brightnessVal">0</span></label>
        <input type="range" id="brightness" min="-100" max="100" value="0">
      </div>
      <div class="control">
        <label for="contrast">对比度 <span id="contrastVal">0</span></label>
        <input type="range" id="contrast" min="-100" max="100" value="0">
      </div>
      <div class="control">
        <label for="saturate">饱和度 <span id="saturateVal">0</span></label>
        <input type="range" id="saturate" min="-100" max="100" value="0">
      </div>
      <div class="control">
        <label for="blur">模糊 <span id="blurVal">0</span>px</label>
        <input type="range" id="blur" min="0" max="20" value="0">
      </div>
      <div class="control">
        <label for="preset">一键预设</label>
        <select id="preset">
          <option value="">自定义</option>
          <option value="grayscale">黑白</option>
          <option value="sepia">复古</option>
          <option value="invert">反色</option>
          <option value="vivid">鲜艳</option>
          <option value="fade">褪色</option>
        </select>
      </div>
      <button class="btn btn-primary" id="btnExport">⬇ 导出图片</button>
    </div>
    <div class="compare">
      <div class="compare-box">
        <h3>原图</h3>
        <img id="previewOrig" alt="原图">
        <div class="compare-meta" id="metaOrig"></div>
      </div>
      <div class="compare-box">
        <h3>效果预览</h3>
        <img id="previewResult" alt="滤镜预览">
        <div class="compare-meta" id="metaResult"></div>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <p>© 2026 PixTools 图片工具箱 · 所有处理均在浏览器本地完成</p>
  </div>
</footer>

<script src="/js/common.js"></script>
<script>
let cachedImg = null;
let currentBlob = null;
let rendering = false;

async function handleFile(file) {
  clearError();
  document.getElementById('dropzone').classList.add('hidden');
  document.getElementById('workArea').classList.remove('hidden');
  const img = await loadImage(file);
  cachedImg = img;
  document.getElementById('previewOrig').src = img.src;
  document.getElementById('metaOrig').textContent = `${file.name} · ${img.naturalWidth}×${img.naturalHeight} · ${fmtBytes(file.size)}`;
  render();
}

function cssFilter() {
  const b = parseInt(document.getElementById('brightness').value);
  const c = parseInt(document.getElementById('contrast').value);
  const s = parseInt(document.getElementById('saturate').value);
  const bl = parseInt(document.getElementById('blur').value);
  return `brightness(${1 + b / 100}) contrast(${1 + c / 100}) saturate(${1 + s / 100}) blur(${bl}px)`;
}

function applyPreset(name) {
  const set = (id, v) => { document.getElementById(id).value = v; document.getElementById(id + 'Val').textContent = v; };
  if (name === 'grayscale') { set('brightness', 0); set('contrast', 0); set('saturate', -100); set('blur', 0); }
  else if (name === 'sepia') { set('brightness', 0); set('contrast', -10); set('saturate', -30); set('blur', 0); }
  else if (name === 'invert') { set('brightness', 0); set('contrast', 0); set('saturate', 0); set('blur', 0); }
  else if (name === 'vivid') { set('brightness', 5); set('contrast', 15); set('saturate', 25); set('blur', 0); }
  else if (name === 'fade') { set('brightness', 10); set('contrast', -20); set('saturate', -20); set('blur', 0); }
}

async function render() {
  if (!cachedImg || rendering) return;
  rendering = true;
  const status = document.getElementById('status');
  status.classList.add('show');
  document.getElementById('statusText').textContent = '应用滤镜…';
  document.getElementById('statusBar').style.width = '50%';

  try {
    const canvas = document.createElement('canvas');
    canvas.width = cachedImg.naturalWidth;
    canvas.height = cachedImg.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.filter = cssFilter();
    ctx.drawImage(cachedImg, 0, 0);
    ctx.filter = 'none';

    // 反色需要像素级处理
    const preset = document.getElementById('preset').value;
    if (preset === 'invert') {
      const id = ctx.getImageData(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < id.data.length; i += 4) {
        id.data[i] = 255 - id.data[i];
        id.data[i + 1] = 255 - id.data[i + 1];
        id.data[i + 2] = 255 - id.data[i + 2];
      }
      ctx.putImageData(id, 0, 0);
    }

    currentBlob = await new Promise((res) => canvas.toBlob(res, 'image/png'));
    document.getElementById('previewResult').src = URL.createObjectURL(currentBlob);
    document.getElementById('metaResult').textContent = `PNG · ${fmtBytes(currentBlob.size)}`;
  } catch (e) {
    console.error(e);
    showError('滤镜处理失败:' + (e.message || e));
  } finally {
    document.getElementById('statusBar').style.width = '100%';
    setTimeout(() => status.classList.remove('show'), 300);
    rendering = false;
  }
}

['brightness', 'contrast', 'saturate', 'blur'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    document.getElementById(id + 'Val').textContent = document.getElementById(id).value;
    clearError();
    if (document.getElementById('preset').value) document.getElementById('preset').value = '';
    render();
  });
});
document.getElementById('preset').addEventListener('change', () => {
  applyPreset(document.getElementById('preset').value);
  ['brightness', 'contrast', 'saturate', 'blur'].forEach(id =>
    document.getElementById(id + 'Val').textContent = document.getElementById(id).value);
  clearError(); render();
});
document.getElementById('btnExport').addEventListener('click', () => {
  if (currentBlob) download(currentBlob, swapExt('filtered', 'png'));
});

setupDropzone('dropzone', 'fileInput', handleFile);
</script>
</body>
</html>
